<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="text-center mb-4">My Expenses</h1>
        <div>
    <p>
        Welcome, {{request.user.username}} |
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-secondary">Logout</a>
    </p>
    </div>
    </div>
    <!-- Add Expense Form -->
    <form method="POST" class="mb-4">
    {% csrf_token %}
    <div class="row g-2">
        <div class="col-md-5">
            <input type="text" name="name" class="form-control" placeholder="Expense Name" required>
        </div>
        <div class="col-md-5">
            <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
        </div>
    </div>
</form>
    
<table class="table table-bordered table-striped bg-white">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Amount (₹)</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.name }}</td>
            <td>{{ expense.amount }}</td>
            <td>
                <a href="{% url 'edit_expense' expense.id %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'delete_expense' expense.id %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center">No expenses yet!</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

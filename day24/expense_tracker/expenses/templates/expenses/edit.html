<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Expense</h2>

    <p class="text-center">
        Welcome, {{ request.user.username }} |
        <a href="{% url 'logout' %}">Logout</a>
    </p>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST" class="bg-white p-4 rounded shadow-sm">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">Expense Name</label>
                    <input type="text" id="name" name="name" value="{{ expense.name }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" id="amount" name="amount" value="{{ expense.amount }}" step="0.01" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success">Update</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>

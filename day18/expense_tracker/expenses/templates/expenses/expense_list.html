<!DOCTYPE html>
<html>
<head>
    <title>My Expenses</title>
</head>
<body>

<h1>My Expenses</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Expense</button>
</form>

<hr>

{% if expenses %}
    <ul>
        {% for expense in expenses %}
            <li>{{ expense.name }} - ₹{{ expense.amount }}</li>
        {% endfor %}
    </ul>
{% else %}
    <p>No expenses yet!</p>
{% endif %}

</body>
</html>
